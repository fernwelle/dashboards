<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1417; --surface:#141d21; --surface-2:#1a262b;
    --line:#243339; --text:#e9f0f1; --muted:#7e949b; --muted-2:#5e747b;
    --accent:#2dd4a7; --accent-soft:rgba(45,212,167,.14);
    --amber:#e6a85c; --red:#f0876b;
    --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
    --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);
    line-height:1.5;-webkit-font-smoothing:antialiased;padding:28px 18px 60px}
  .wrap{max-width:760px;margin:0 auto}

  .eyebrow{font-family:var(--display);font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
  .eyebrow .date{color:var(--accent)}

  .hero{margin:18px 0 26px;display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .hero .now{font-family:var(--display);font-weight:600;font-size:clamp(3.4rem,16vw,5.6rem);
    line-height:.9;letter-spacing:-.02em}
  .hero .now span{font-size:.3em;color:var(--muted);font-weight:500;margin-left:4px}
  .hero .deltas{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
  .chip{font-family:var(--display);font-size:.82rem;font-weight:500;padding:3px 10px;
    border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .chip.down{color:var(--accent);border-color:rgba(45,212,167,.4);background:var(--accent-soft)}
  .chip.up{color:var(--red);border-color:rgba(240,135,107,.35);background:rgba(240,135,107,.1)}
  .chip.flat{color:var(--muted)}
  .chip b{font-weight:700}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
  .chart-card{padding:18px 14px 8px}
  svg{width:100%;height:auto;display:block;overflow:visible}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--display);font-size:1.5rem;font-weight:600;margin-top:5px;line-height:1.1}
  .stat .v small{font-size:.62em;color:var(--muted);font-weight:500}
  .stat .sub{font-size:.74rem;color:var(--muted-2);margin-top:3px}

  .bmi-tag{display:inline-block;font-family:var(--display);font-size:.7rem;font-weight:600;
    padding:2px 8px;border-radius:6px;margin-top:6px}

  .log{margin-top:18px}
  .log h2{font-family:var(--display);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px;padding-left:2px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{font-family:var(--display);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted-2);font-weight:500}
  td{font-variant-numeric:tabular-nums}
  td.num{font-family:var(--display);font-weight:500}
  td .d-down{color:var(--accent)} td .d-up{color:var(--red)} td .d-flat{color:var(--muted-2)}
  tr:last-child td{border-bottom:none}

  .foot{margin-top:26px;font-size:.78rem;color:var(--muted-2);text-align:center;line-height:1.6}

  @media (prefers-reduced-motion:no-preference){
    .reveal{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow reveal">
    <span>Weight Journey · Dev</span>
    <span class="date" id="asof"></span>
  </div>

  <div class="hero reveal">
    <div class="now" id="now"></div>
    <div class="deltas" id="deltas"></div>
  </div>

  <div class="card chart-card reveal" id="chartCard"></div>

  <div class="grid reveal" id="stats"></div>

  <div class="log card reveal">
    <h2>Recent entries</h2>
    <table>
      <thead><tr><th>Date</th><th>Weight</th><th>Change</th><th>BMI</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

  <div class="foot">
    Goal <span id="goalTxt"></span> · Height 1.80 m · To log a new weight, type <b>LOG&nbsp;&lt;weight&gt;</b> in this project.
  </div>
</div>

<script>
/* ===== DATA (edit only this block to update) ===== */
const HEIGHT_M = 1.80;
const GOAL = 79;               // kg — target weight
const DATA = [
  { date:"2026-06-01", weight:115.0 },
  { date:"2026-06-19", weight:113.0 }
];
/* ================================================= */

const kg = n => n.toFixed(1);
const bmi = w => w/(HEIGHT_M*HEIGHT_M);
const fmtDate = s => new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const shortDate = s => new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
const daysBetween = (a,b)=>(new Date(b)-new Date(a))/86400000;

const bmiBand = b =>
  b<18.5 ? {l:"Underweight",c:"var(--amber)"} :
  b<25   ? {l:"Healthy",   c:"var(--accent)"} :
  b<30   ? {l:"Overweight",c:"var(--amber)"} :
  b<35   ? {l:"Obese I",   c:"var(--red)"} :
  b<40   ? {l:"Obese II",  c:"var(--red)"} :
           {l:"Obese III", c:"var(--red)"};

const latest = DATA[DATA.length-1];
const first  = DATA[0];
const prev   = DATA.length>1 ? DATA[DATA.length-2] : null;

/* ---- hero ---- */
document.getElementById("asof").textContent = "as of "+fmtDate(latest.date);
document.getElementById("now").innerHTML = kg(latest.weight)+"<span>kg</span>";
document.getElementById("goalTxt").textContent = kg(GOAL)+" kg";

function deltaChip(value,label){
  const cls = value<-0.05?"down":value>0.05?"up":"flat";
  const arrow = value<-0.05?"▼":value>0.05?"▲":"–";
  const v = Math.abs(value)<0.05?"no change":arrow+" "+kg(Math.abs(value))+" kg";
  return `<span class="chip ${cls}"><b>${v}</b> ${label}</span>`;
}
let chips="";
if(prev) chips += deltaChip(latest.weight-prev.weight, "since last");
chips += deltaChip(latest.weight-first.weight, "total");
document.getElementById("deltas").innerHTML = chips;

/* ---- regression for rate (last <=42 days) ---- */
function trend(points){
  if(points.length<2) return null;
  const t0=new Date(points[0].date);
  const xs=points.map(p=>(new Date(p.date)-t0)/86400000);
  const ys=points.map(p=>p.weight);
  const n=xs.length, sx=xs.reduce((a,b)=>a+b), sy=ys.reduce((a,b)=>a+b);
  const sxx=xs.reduce((a,x)=>a+x*x,0), sxy=xs.reduce((a,x,i)=>a+x*ys[i],0);
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx||1);  // kg/day
  return slope*7; // kg/week
}
const cutoff = new Date(latest.date); cutoff.setDate(cutoff.getDate()-42);
const recent = DATA.filter(d=>new Date(d.date)>=cutoff);
const weekly = trend(recent.length>1?recent:DATA);

/* ---- stats ---- */
const b = bmi(latest.weight), band = bmiBand(b);
const toGoal = latest.weight-GOAL;
let projHtml = "—", projSub = "log more to estimate";
if(weekly && weekly<-0.02 && toGoal>0){
  const weeks = toGoal/(-weekly);
  const eta = new Date(latest.date); eta.setDate(eta.getDate()+Math.round(weeks*7));
  projHtml = eta.toLocaleDateString("en-GB",{month:"short",year:"numeric"});
  projSub = "≈ "+Math.round(weeks)+" weeks at current pace";
} else if(toGoal<=0){ projHtml="Reached"; projSub="goal achieved"; }

const stats=[
  {k:"BMI", v:b.toFixed(1), tag:band},
  {k:"Total lost", v:(first.weight-latest.weight>=0?"−":"+")+kg(Math.abs(first.weight-latest.weight)), unit:"kg", sub:"since "+shortDate(first.date)},
  {k:"To goal", v:(toGoal>0?kg(toGoal):"0.0"), unit:"kg", sub:toGoal>0?"remaining":"done"},
  {k:"Weekly rate", v:weekly?(weekly<0?"−":"+")+kg(Math.abs(weekly)):"—", unit:weekly?"kg/wk":"", sub:weekly?"recent trend":"need 2+ logs"},
  {k:"Goal ETA", v:projHtml, sub:projSub},
  {k:"Entries", v:DATA.length, sub:DATA.length>1?daysBetween(first.date,latest.date).toFixed(0)+" days tracked":"day one"},
];
document.getElementById("stats").innerHTML = stats.map(s=>`
  <div class="stat">
    <div class="k">${s.k}</div>
    <div class="v">${s.v}${s.unit?` <small>${s.unit}</small>`:""}</div>
    ${s.tag?`<span class="bmi-tag" style="background:${s.tag.c}22;color:${s.tag.c}">${s.tag.l}</span>`
           :`<div class="sub">${s.sub||""}</div>`}
  </div>`).join("");

/* ---- SVG chart ---- */
(function chart(){
  const W=700,H=300,P={t:24,r:20,b:34,l:44};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const weights=DATA.map(d=>d.weight).concat([GOAL]);
  let lo=Math.min(...weights), hi=Math.max(...weights);
  const pad=Math.max((hi-lo)*0.12,1.5); lo-=pad; hi+=pad;
  const t0=new Date(first.date), t1=new Date(latest.date);
  const span=Math.max(daysBetween(first.date,latest.date),1);
  const X=d=>P.l + (DATA.length===1?iw/2:(daysBetween(first.date,d)/span)*iw);
  const Y=w=>P.t + (1-(w-lo)/(hi-lo))*ih;

  const gridVals=[]; const step=(hi-lo)/4;
  for(let i=0;i<=4;i++) gridVals.push(lo+step*i);

  const pts=DATA.map(d=>[X(d.date),Y(d.weight)]);
  const linePath=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const areaPath = pts.length>1
    ? linePath+` L${pts[pts.length-1][0].toFixed(1)} ${(P.t+ih).toFixed(1)} L${pts[0][0].toFixed(1)} ${(P.t+ih).toFixed(1)} Z`
    : "";
  const last=pts[pts.length-1];

  const gy=Y(GOAL);
  const svg=`
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridVals.map(v=>{const y=Y(v).toFixed(1);return`
      <line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${P.l-10}" y="${y}" fill="var(--muted-2)" font-size="11" font-family="var(--display)" text-anchor="end" dominant-baseline="middle">${v.toFixed(0)}</text>`;}).join("")}
    <line x1="${P.l}" y1="${gy.toFixed(1)}" x2="${W-P.r}" y2="${gy.toFixed(1)}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/>
    <text x="${W-P.r}" y="${(gy-7).toFixed(1)}" fill="var(--amber)" font-size="11" font-family="var(--display)" text-anchor="end">goal ${GOAL.toFixed(0)}</text>
    ${areaPath?`<path d="${areaPath}" fill="url(#fill)"/>`:""}
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
    <text x="${last[0].toFixed(1)}" y="${(last[1]-14).toFixed(1)}" fill="var(--text)" font-size="13" font-weight="600" font-family="var(--display)" text-anchor="middle">${kg(latest.weight)}</text>
    <text x="${P.l}" y="${H-10}" fill="var(--muted-2)" font-size="11" font-family="var(--display)">${shortDate(first.date)}</text>
    <text x="${W-P.r}" y="${H-10}" fill="var(--muted-2)" font-size="11" font-family="var(--display)" text-anchor="end">${shortDate(latest.date)}</text>
  </svg>`;
  document.getElementById("chartCard").innerHTML=svg;
})();

/* ---- recent log table (newest first, up to 8) ---- */
const rows=[...DATA].map((d,i)=>({...d, prevW:i>0?DATA[i-1].weight:null}))
  .slice(-8).reverse();
document.getElementById("logBody").innerHTML = rows.map(r=>{
  let ch="<span class='d-flat'>—</span>";
  if(r.prevW!==null){const dv=r.weight-r.prevW;
    const c=dv<-0.05?"d-down":dv>0.05?"d-up":"d-flat";
    const a=dv<-0.05?"▼":dv>0.05?"▲":"–";
    ch=`<span class="${c}">${Math.abs(dv)<0.05?"0.0":a+" "+kg(Math.abs(dv))}</span>`;}
  return `<tr>
    <td>${fmtDate(r.date)}</td>
    <td class="num">${kg(r.weight)} kg</td>
    <td class="num">${ch}</td>
    <td class="num">${bmi(r.weight).toFixed(1)}</td>
  </tr>`;
}).join("");
</script>
</body>
</html>
